<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
    <style>
        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        pre {
            color: #ff8800;
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(4px, 1.2vw, 14px);
            line-height: 1.1;
            text-align: center;
            white-space: pre;
        }
    </style>
</head>
<body>
    <pre id="ascii"></pre>
    <script>
        // Each letter is 7 rows tall, defined as binary patterns
        // 1 = filled, 0 = empty, each letter has consistent width
        const font = {
            'H': [
                "##    ##",
                "##    ##",
                "##    ##",
                "########",
                "##    ##",
                "##    ##",
                "##    ##"
            ],
            'E': [
                "######",
                "##    ",
                "##    ",
                "##### ",
                "##    ",
                "##    ",
                "######"
            ],
            'L': [
                "##    ",
                "##    ",
                "##    ",
                "##    ",
                "##    ",
                "##    ",
                "######"
            ],
            'O': [
                " #### ",
                "##  ##",
                "##  ##",
                "##  ##",
                "##  ##",
                "##  ##",
                " #### "
            ],
            'W': [
                "##      ##",
                "##      ##",
                "##      ##",
                "##  ##  ##",
                "##  ##  ##",
                "##  ##  ##",
                " ###  ### "
            ],
            'R': [
                "##### ",
                "##  ##",
                "##  ##",
                "##### ",
                "##  ##",
                "##  ##",
                "##  ##"
            ],
            'D': [
                "##### ",
                "##  ##",
                "##  ##",
                "##  ##",
                "##  ##",
                "##  ##",
                "##### "
            ],
            '!': [
                "##",
                "##",
                "##",
                "##",
                "##",
                "  ",
                "##"
            ],
            ' ': [
                "    ",
                "    ",
                "    ",
                "    ",
                "    ",
                "    ",
                "    "
            ]
        };

        function renderText(text) {
            const lines = ['', '', '', '', '', '', ''];
            const spacing = "  "; // 2 spaces between letters

            for (let i = 0; i < text.length; i++) {
                const char = text[i].toUpperCase();
                const glyph = font[char] || font[' '];

                for (let row = 0; row < 7; row++) {
                    if (i > 0) lines[row] += spacing;
                    lines[row] += glyph[row];
                }
            }

            return lines.join('\n');
        }

        const hello = renderText("HELLO");
        const world = renderText("WORLD!");

        document.getElementById('ascii').textContent = hello + "\n\n" + world;
    </script>
</body>
</html>
