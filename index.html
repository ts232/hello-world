<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
    <style>
        body {
            background-color: #1a1a2e;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #ascii {
            color: #ff8800;
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(6px, 1.5vw, 16px);
            line-height: 1.1;
            white-space: pre;
            position: absolute;
            transition: transform 0.5s ease-in-out;
        }
        #sun {
            color: #ffdd00;
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(6px, 1.2vw, 14px);
            line-height: 1.1;
            white-space: pre;
            position: absolute;
            top: 20px;
            right: 30px;
            text-shadow: 0 0 10px #ffaa00, 0 0 20px #ff8800, 0 0 30px #ff6600;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px #ffaa00, 0 0 20px #ff8800, 0 0 30px #ff6600; }
            50% { opacity: 0.8; text-shadow: 0 0 20px #ffcc00, 0 0 40px #ffaa00, 0 0 60px #ff8800; }
        }
    </style>
</head>
<body>
    <pre id="sun"></pre>
    <pre id="ascii"></pre>
    <script>
        // Each letter is 7 rows tall, defined with consistent width
        const font = {
            'H': [
                "##    ##",
                "##    ##",
                "##    ##",
                "########",
                "##    ##",
                "##    ##",
                "##    ##"
            ],
            'E': [
                "######",
                "##    ",
                "##    ",
                "##### ",
                "##    ",
                "##    ",
                "######"
            ],
            'L': [
                "##    ",
                "##    ",
                "##    ",
                "##    ",
                "##    ",
                "##    ",
                "######"
            ],
            'O': [
                " #### ",
                "##  ##",
                "##  ##",
                "##  ##",
                "##  ##",
                "##  ##",
                " #### "
            ],
            'W': [
                "##      ##",
                "##      ##",
                "##      ##",
                "##  ##  ##",
                "##  ##  ##",
                "##  ##  ##",
                " ###  ### "
            ],
            'R': [
                "##### ",
                "##  ##",
                "##  ##",
                "##### ",
                "##  ##",
                "##  ##",
                "##  ##"
            ],
            'D': [
                "##### ",
                "##  ##",
                "##  ##",
                "##  ##",
                "##  ##",
                "##  ##",
                "##### "
            ],
            '!': [
                "##",
                "##",
                "##",
                "##",
                "##",
                "  ",
                "##"
            ],
            ' ': [
                "    ",
                "    ",
                "    ",
                "    ",
                "    ",
                "    ",
                "    "
            ]
        };

        function renderText(text) {
            const lines = ['', '', '', '', '', '', ''];
            const spacing = "  ";

            for (let i = 0; i < text.length; i++) {
                const char = text[i].toUpperCase();
                const glyph = font[char] || font[' '];

                for (let row = 0; row < 7; row++) {
                    if (i > 0) lines[row] += spacing;
                    lines[row] += glyph[row];
                }
            }

            return lines.join('\n');
        }

        // Render the text
        const hello = renderText("HELLO");
        const world = renderText("WORLD!");
        const asciiEl = document.getElementById('ascii');
        asciiEl.textContent = hello + "\n\n" + world;

        // ASCII Sun - bigger and better aligned
        const sun = `         .    *    .
      *    \\ | /    *
        '.- *** -.'
       -==  ***  ==-
        .-' *** '-.
      *    / | \\    *
         '    *    '`;
        document.getElementById('sun').textContent = sun;

        // Animation variables
        let posX = 100;
        let posY = 100;
        let velX = 2;
        let velY = 1.5;

        function animate() {
            const maxX = window.innerWidth - asciiEl.offsetWidth - 20;
            const maxY = window.innerHeight - asciiEl.offsetHeight - 20;

            // Update position
            posX += velX;
            posY += velY;

            // Bounce off edges
            if (posX <= 0 || posX >= maxX) {
                velX *= -1;
                posX = Math.max(0, Math.min(posX, maxX));
            }
            if (posY <= 0 || posY >= maxY) {
                velY *= -1;
                posY = Math.max(0, Math.min(posY, maxY));
            }

            // Add some randomness to velocity occasionally
            if (Math.random() < 0.02) {
                velX += (Math.random() - 0.5) * 0.5;
                velY += (Math.random() - 0.5) * 0.5;
                // Clamp velocity
                velX = Math.max(-4, Math.min(4, velX));
                velY = Math.max(-4, Math.min(4, velY));
            }

            asciiEl.style.left = posX + 'px';
            asciiEl.style.top = posY + 'px';

            requestAnimationFrame(animate);
        }

        // Start animation
        animate();
    </script>
</body>
</html>
